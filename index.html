<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Horários de Ônibus - Santa Catarina
  </title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header>

    <h1>
      Horários de Ônibus - Santa Catarina
    </h1>

    <p>
      Consulte horários e visualize mapas das regiões
    </p>

  </header>

  <div class="container">

    <div class="form-group">

      <label for="regiao">
        Escolha uma região:
      </label>

      <select id="regiao">

        <option value="">
          Selecione uma região
        </option>

        <option value="Florianópolis">
          Florianópolis
        </option>

        <option value="São José">
          São José
        </option>

        <option value="Palhoça">
          Palhoça
        </option>

        <option value="Joinville">
          Joinville
        </option>

        <option value="Blumenau">
          Blumenau
        </option>

        <option value="Chapecó">
          Chapecó
        </option>

        <option value="Lages">
          Lages
        </option>

        <option value="Itajaí">
          Itajaí
        </option>

        <option value="Criciúma">
          Criciúma
        </option>

      </select>

    </div>

    <button onclick="gerarHorarios()">
      Gerar Horários
    </button>

    <div
      class="resultado"
      id="resultado"
    ></div>

  </div>

  <!-- MODAL MAPA -->

  <div
    class="modal"
    id="modalMapa"
  >

    <div class="modal-conteudo">

      <span
        class="fechar"
        onclick="fecharMapa()"
      >
        &times;
      </span>

      <h2 id="tituloMapa"></h2>

      <iframe
        id="mapaFrame"
        width="100%"
        height="350"
        style="
          border:0;
          border-radius: 10px;
        "
        loading="lazy"
      >
      </iframe>

    </div>

  </div>

  <footer>

    Desenvolvido com HTML, CSS e JavaScript
    • Santa Catarina

  </footer>

  <script src="script.js"></script>

</body>
</html>
